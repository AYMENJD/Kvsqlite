name: Test kvsqlite

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "main"
    paths:
      - "kvsqlite/**"
      - "test/**"
      - "pyproject.toml"
      - ".github/workflows/test-kvsqlite.yml"

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio
          pip install .

      - name: Test
        run: |
          set +e
          python -m pytest test/ -v --tb=short | tee "$RUNNER_TEMP/pytest.txt"
          status=${PIPESTATUS[0]}
          {
            echo "## Python ${{ matrix.python-version }}"
            echo
            echo '```'
            cat "$RUNNER_TEMP/pytest.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
