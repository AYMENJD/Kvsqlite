name: Benchmark kvsqlite

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    paths:
      - "benchmark/"
      - "kvsqlite/"
      - ".github/workflows/benchmark-kvsqlite.yml"

jobs:
  benchmark:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psutil
          pip install .

      - name: Benchmark
        run: |
          python benchmark/benchmark_kvsqlite.py \
            --query-count 100000 \
            --db-path "$RUNNER_TEMP/bench.sqlite" \
            | tee "$RUNNER_TEMP/bench.txt"
          {
            echo "## Python ${{ matrix.python-version }}"
            echo
            echo '```'
            cat "$RUNNER_TEMP/bench.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
